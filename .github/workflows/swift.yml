name: Mac build and tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/generate-xcode-project.py && git diff --exit-code -- TrioPC.xcodeproj
      - run: swift test
      - name: Type-check separate iOS history publisher
        run: |
          TRIOPC_IOS_SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun swiftc -typecheck -swift-version 6 -target arm64-apple-ios18.0 -sdk "$TRIOPC_IOS_SDK" -module-cache-path /tmp/TrioPC-iOS-history-cache integrations/trio-v1.0.2/publisher/TrioPCResponseOutbox.swift
      - run: xcodebuild -project TrioPC.xcodeproj -scheme TrioPC -configuration Debug -destination 'platform=macOS' -derivedDataPath /tmp/TrioPC-Xcode CODE_SIGNING_ALLOWED=NO build
      - run: bash scripts/build-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: TrioPC-macOS
          path: dist/TrioPC-macOS.zip
